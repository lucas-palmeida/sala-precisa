# Integração contínua: executa o build completo (análise estática, testes unitários,
# de componente, de segurança e de sistema com Selenium) em Linux, macOS e Windows
# a cada push ou pull request, comprovando que o projeto funciona nos três sistemas.
name: Build e testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Instalar o JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Navegador escolhido automaticamente: Chrome no Linux e no macOS, Edge no Windows
      # (ambos já instalados nas máquinas do GitHub Actions).
      - name: Build completo com testes de sistema
        run: ./mvnw -B clean verify -Psistema

      - name: Publicar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-${{ matrix.os }}
          path: |
            target/site/jacoco*/
            target/surefire-reports/
            target/failsafe-reports/
            target/reports/
            docs/evidencias/sistema/
          if-no-files-found: warn
