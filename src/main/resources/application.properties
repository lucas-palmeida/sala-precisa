spring.application.name=salaprecisa

# Banco de dados H2 em memória (dados são perdidos ao encerrar a aplicação)
spring.datasource.url=jdbc:h2:mem:salaprecisa;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console web do H2 desligado (evita expor o banco pelo navegador)
spring.h2.console.enabled=false

# Respostas de erro sem detalhes internos (stack trace, mensagem da exceção)
server.error.include-stacktrace=never
server.error.include-message=never

# Sessão (correções do teste de segurança, ver docs/teste-seguranca.md):
# - o identificador de sessão trafega somente por cookie, nunca na URL (;jsessionid=...);
# - o cookie não é acessível por JavaScript (HttpOnly) e não é enviado em requisições
#   originadas de outros sites (SameSite=Lax), reduzindo o risco de CSRF.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
